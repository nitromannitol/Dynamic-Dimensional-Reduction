automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5"
        - "claude-sonnet-5"
        - "claude-opus-5-5"
        - "claude-haiku-5-5"
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Lean proof development, review and release preparation with Lake builds under the pinned
        Lean toolchain, Mathlib and Lattice-Probability revisions; every change was checked by the
        statement-hash, axiom-closure and warning-free-build checks of tools/verify.py.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work, closely supervised by the author, on author-specified statements.
    - method: "agent"
      models:
        - "gpt-6.1-sol"
      framework: "Codex CLI (OpenAI)"
      tool_setup: >-
        Lean proof development under the same toolchain and pins.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work; each task fixed the statements to be proved and forbade changing them.
    - method: "agent"
      models:
        - "deepseek-v4.1-flash"
      framework: "API-hosted model driven by project scripts"
      tool_setup: >-
        Auxiliary proof search on small typed proof obligations.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "API-only"
  spend_usd: "not tracked"
  notes: >-
    The Lean code was written by AI coding agents under the close supervision of the author, who
    fixed the statements to be formalized. Every proof is checked by the Lean kernel; the library
    contains no sorry and no custom axiom. The model versions listed are those recorded during
    the work.

fidelity:
  divergences: >-
    The Lean statements follow the corrected edition in paper/corrected-arxiv/. Theorem 1.1 and
    Corollary 1.1 are stated as published, with the hitting time of Theorem 1.1(ii) defined
    through some inner-boundary site (C01). The changes C01-C25 to lemmas, corollaries, a
    proposition, definitions and proofs are listed with the published text, the corrected text
    and a reason in the corrected edition's section "Corrections to the published version" and
    in README.md.

review:
  status: "author-reviewed"
  reviewers:
  - Ahmed Bou-Rabee
  notes: >-
    The statements were compared with the corrected edition by the author and by a separate
    read-only model review. Not external peer review.

