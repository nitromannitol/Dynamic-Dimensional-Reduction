version: v0.4
project:
  name: Dynamic-Dimensional-Reduction
  description: 'A Lean 4/Mathlib formalization of *Dynamic dimensional reduction in the Abelian sandpile*
    (Bou-Rabee, Comm. Math. Phys. 2022; arXiv:2009.05968): the joint induction proving dimensional reduction
    at every time, reduction of the terminal odometer, self-similarity, and the two clauses of Corollary
    1.1, with no assumed results.  The ten statements of Theorem 1.1, Corollary 1.1 and Proposition 4.1
    are checked independently by the four leanprover/comparator pairs under DimRedAudit/.'
  authors:
  - Ahmed Bou-Rabee
  license: Apache-2.0
classification:
  arxiv:
  - math.PR
  - math-ph
  msc2020:
  - 82C27
  - 37B15
  - 39A12
sources:
- title: Dynamic dimensional reduction in the Abelian sandpile
  authors:
  - Ahmed Bou-Rabee
  id: arXiv:2009.05968
  url: https://arxiv.org/abs/2009.05968
  type: journal article
  license: ''
  author_contacted: n/a
  prior_work: ''
status:
  scope: 'A Lean 4 / Mathlib formalization, complete, of every theorem, lemma, proposition and corollary
    of the paper, 20 registered statements in all: the three displays of Theorem 1.1 (dimensional reduction
    at every time, dimensional reduction of the terminal odometer, and self-similarity), the two clauses
    of Corollary 1.1, the results of Sections 2 and 3 (Lemmas 2.1 to 2.5, Corollaries 2.1 and 2.2, Proposition
    3.1, Lemma 3.1, Proposition 3.2) and the five clauses of Proposition 4.1. PROVED (20): all 20 have
    state SEALED in ledger/manifest.yaml, with complete proofs whose axiom closure is exactly propext,
    Classical.choice and Quot.sound; the build emits no warning and no sorry. The ten statements of Theorem
    1.1, Corollary 1.1 and Proposition 4.1 are proved by the joint induction of Sections 4 and 5 over
    dimension, side length and time (DimRed.reg_proved in DimRed/Support/RegProved.lean), from which the
    frozen statements, odd cubes and the unit half-side included, are read off. SCOPE BOUNDARY: nothing
    is assumed; no cited result is taken as a hypothesis (ASSUMPTIONS.md). The paper formalized is paper/dimred.tex,
    the arXiv source with the corrections listed in paper/CHANGES_FROM_ARXIV.md. Not formalized: the introduction''s
    discussion, the open problems of Section 1 and the figures. Every result is stated in full in DimRed/MainTheorems.lean;
    the ten statements of Theorem 1.1, Corollary 1.1 and Proposition 4.1 have Mathlib-only comparator
    challenges in the four pairs under DimRedAudit/ (DimRedAudit/README.md).'
