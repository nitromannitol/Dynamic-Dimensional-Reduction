fidelity:
  divergences: The manifest selects the separate corrected arXiv-format draft, whose surgical C01-C25
    changes and C18 proof-description refinement are recorded in paper/corrected-arxiv/SOURCE_NOTE.md.
    All source-facing rows have Frozen declarations with repaired signed-height scope, folded-process identification
    and physical pile/nonempty-maximum carriers. The official arXiv extraction and historical local text
    are preserved. This is not a certificate against unchanged arXiv v2.
review:
  status: independently-reviewed
  reviewers:
  - Ahmed Bou-Rabee
  notes: The corrected-source statements, definitions and consumers were reviewed independently against the
    corrected draft; see ledger/audits/2026-10-19-corrected-source-integration.md. The integrated tree builds and
    passes tools/verify.py. Historical comparator receipts apply only at their exact original statements and
    source pins.
alignment:
  namespace: DimRed
  statements:
  - source: Theorem 1.1 (the_theorem), three displays
    lean: DimRed.Frozen.dimensional_reduction, DimRed.Frozen.terminal_dimensional_reduction, DimRed.Frozen.self_similarity
    module: DimRed.Frozen.Main
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its frozen counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: Corollary 1.1, two clauses
    lean: DimRed.Frozen.sandpile_dimensional_reduction, DimRed.Frozen.sandpile_self_similarity
    module: DimRed.Frozen.Main
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its frozen counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: Proposition 4.1 (base_dimension), five clauses
    lean: DimRed.Frozen.base_dimension_*
    module: DimRed.Frozen.Regularity
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its frozen counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: 'Sections 2 and 3: every lemma, corollary and proposition'
    lean: DimRed.* in DimRed/MainTheorems.lean
    module: DimRed.MainTheorems
    status: proved
    note: Each restates its frozen counterpart DimRed.Frozen.* unchanged; the full map is in
      README.md and CORRESPONDENCE.md.
