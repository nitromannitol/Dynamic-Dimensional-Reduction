automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
        - "Claude Sonnet 5"
        - "Claude Opus 5"
        - "DeepSeek v4.1 Flash"
      framework: >-
        Claude Code (Anthropic) and the Pi agent harness, directing the models above; the author
        supervised the work and is responsible for the formalization.
      tool_setup: >-
        Lake builds under the pinned Lean toolchain and Mathlib revision. Every change is gated by
        the axiom-closure and warning-free-build checks, and the public CI runs the Mathlib-only
        comparator challenge/solution pairs against leanprover/comparator, lean4export and landrun
        at the revisions recorded in .github/workflows/.
      cost:
        spend_usd: "not separately tracked (subscription and API accounts)"
        hardware: "one Ubuntu workstation"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author. Statement differences from the
        paper are disclosed under fidelity.
fidelity:
  divergences: 'Every frozen statement states what paper/dimred.tex states.  That file is the arXiv source
    (arXiv:2009.05968v2) with the corrections listed in paper/CHANGES_FROM_ARXIV.md: axis monotonicity
    (Corollary 2.1) in the one-step form of Babai and Gorodezky, the topple time tau_j defined with "for
    some boundary site", the ripple clause of Proposition 3.2 as the front-shifted profile, two displays
    of Proposition 4.1, the nonnegativity of the initial sandpile in Lemma 2.1 and the membership condition
    in the first boundary branch of Lemma 2.4. CORRESPONDENCE.md records the vocabulary and the standing
    hypotheses the frozen statements write out; the dimension of Theorem 1.1 is written d + 1.'
review:
  status: author-verified
  reviewers:
  - Ahmed Bou-Rabee
  notes: Correctness of every proved result is guaranteed by the Lean kernel and Mathlib. The statement-level
    decisions are the author's and are recorded in ledger/decisions.md. All four comparator pairs under
    DimRedAudit/ are accepted by both the Lean kernel and the nanoda kernel (DimRedAudit/README.md). This is not external
    peer review.
alignment:
  namespace: DimRed
  statements:
  - source: Theorem 1.1 (the_theorem), three displays
    lean: DimRed.Frozen.dimensional_reduction, DimRed.Frozen.terminal_dimensional_reduction, DimRed.Frozen.self_similarity
    module: DimRed.Frozen.Main
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its certified counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: Corollary 1.1, two clauses
    lean: DimRed.Frozen.sandpile_dimensional_reduction, DimRed.Frozen.sandpile_self_similarity
    module: DimRed.Frozen.Main
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its certified counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: Proposition 4.1 (base_dimension), five clauses
    lean: DimRed.Frozen.base_dimension_*
    module: DimRed.Frozen.Regularity
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its certified counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: 'Sections 2 and 3: every lemma, corollary and proposition'
    lean: DimRed.* in DimRed/MainTheorems.lean
    module: DimRed.MainTheorems
    status: proved
    note: Each restates its certified counterpart DimRed.Frozen.* unchanged; the full map is in README.md
      and CORRESPONDENCE.md.
acknowledgements: Built on Lean 4, Mathlib, Lake and the shared library Lattice-Probability.
