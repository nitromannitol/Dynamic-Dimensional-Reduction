fidelity:
  divergences: 'The current proof certificate concerns registered Lean statements pinned to
    corrected local text paper/dimred.tex, not the author-selected arXiv v2 source. Known
    open issues include extra chip-height premises, incomplete symmetrized-odometer coverage,
    and public definition bodies on empty or infinite carriers. CORRESPONDENCE.md records
    current intended local-text mappings; an arXiv-v2 correspondence audit is in progress.'
review:
  status: source-audit-open
  reviewers:
  - Ahmed Bou-Rabee
  notes: The Lean kernel checks proofs of the registered statements. Source fidelity to the
    selected arXiv v2 text, including public definition bodies and live consumers, remains open.
    Comparator checks are evidence about the registered Lean surface, not a paper-level seal.
alignment:
  namespace: DimRed
  statements:
  - source: Theorem 1.1 (the_theorem), three displays
    lean: DimRed.Frozen.dimensional_reduction, DimRed.Frozen.terminal_dimensional_reduction, DimRed.Frozen.self_similarity
    module: DimRed.Frozen.Main
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its certified counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: Corollary 1.1, two clauses
    lean: DimRed.Frozen.sandpile_dimensional_reduction, DimRed.Frozen.sandpile_self_similarity
    module: DimRed.Frozen.Main
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its certified counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: Proposition 4.1 (base_dimension), five clauses
    lean: DimRed.Frozen.base_dimension_*
    module: DimRed.Frozen.Regularity
    status: proved
    note: Frozen statements, proved by the joint induction of Sections 4 and 5 (DimRed.reg_proved); each
      restates its certified counterpart DimRed.Frozen.* unchanged in DimRed/MainTheorems.lean.
  - source: 'Sections 2 and 3: every lemma, corollary and proposition'
    lean: DimRed.* in DimRed/MainTheorems.lean
    module: DimRed.MainTheorems
    status: proved
    note: Each restates its certified counterpart DimRed.Frozen.* unchanged; the full map is in README.md
      and CORRESPONDENCE.md.
acknowledgements: Built on Lean 4, Mathlib, Lake and the shared library Lattice-Probability.
