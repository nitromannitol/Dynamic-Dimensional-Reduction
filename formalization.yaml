version: "v0.4"

project:
  name: "Dynamic dimensional reduction in the Abelian sandpile"
  description: >-
    A Lean 4 formalization of the paper "Dynamic dimensional reduction in the Abelian sandpile"
    by Bou-Rabee (Comm. Math. Phys. 390 (2022); arXiv:2009.05968), in a corrected edition of
    the arXiv source: dimensional reduction and self-similarity of the parallel toppling
    odometer (Theorem 1.1), the corresponding statements for the sandpile (Corollary 1.1) and
    the regularity proposition (Proposition 4.1) proved with them by one joint induction over
    dimension, side length and time, together with every lemma, corollary and proposition of
    Sections 2 and 3. The main results are stated as published. The four Mathlib-only
    comparator pairs under DimRedAudit/ check Theorem 1.1, Corollary 1.1 and Proposition 4.1.
  authors:
  - Ahmed Bou-Rabee
  responsible_maintainers:
  - Ahmed Bou-Rabee
  license: Apache-2.0

classification:
  arxiv:
  - math.PR
  - math-ph
  msc2020:
  - 82C27
  - 37B15
  - 39A12

sources:
- title: Dynamic dimensional reduction in the Abelian sandpile
  authors:
  - Ahmed Bou-Rabee
  id: arXiv:2009.05968
  url: https://arxiv.org/abs/2009.05968
  type: journal article
  location: paper/dimred-arxiv.tex
  relationship: formalizes
  note: >-
    Comm. Math. Phys. 390 (2022), 933-958. The unmodified arXiv source (v2) is
    paper/dimred-arxiv.tex.
  author_endorsement: participated
- title: Dynamic dimensional reduction in the Abelian sandpile, corrected edition
  authors:
  - Ahmed Bou-Rabee
  type: corrected source
  location: paper/corrected-arxiv/dimred-corrected-arxiv.tex
  relationship: formalizes
  note: >-
    The text the Lean statements follow, pinned by its SHA-256 in ledger/manifest.yaml. Its
    section "Corrections to the published version" lists every change from arXiv v2.
  author_endorsement: participated

related_formalizations:
- id: https://github.com/nitromannitol/Lattice-Probability
  relationship: builds-on
  note: Lattice-Probability, a git dependency pinned to commit bbe0b90a7cf0517db0578139aaab7f152edbc45e.

status:
  scope: >-
    All 23 theorem-level statements of the corrected edition, the 20 statement clauses of the published paper and three added lemmas, are proved in Lean, with no sorry and only the standard axioms; Theorem 1.1 and Corollary 1.1 are stated as published.
  sorry_count: 0
  sorry_count_scope: "the DimRed library"
  comparator_challenge_sorry_count: 10
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
    - declaration: "DimRed.dimensional_reduction"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/DimensionalReduction/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.terminal_dimensional_reduction"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/DimensionalReduction/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.self_similarity"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/SelfSimilarity/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.sandpile_dimensional_reduction"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/Sandpile/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.sandpile_self_similarity"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/Sandpile/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.base_dimension_consistency"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/Regularity/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.base_dimension_weak_compatibility"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "DimRedAudit/Regularity/comparator.json"
      literature_dependencies: []
    - declaration: "DimRed.base_dimension_strong_derivative"
      file: "DimRed/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
