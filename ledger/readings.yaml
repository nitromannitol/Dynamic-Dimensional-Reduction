# Readings of the statements of the corrected edition, used by the clause, constant and exponent checks.
clauses:
  prop-base-dimension-weak: dimred-corrected-arxiv.tex:815-822 (label base_dimension, clause weak facet
    compatibility). M>=2; every legal facet p=(head,1,ones) with head coordinates >=2, including an empty
    head. At t>=1 a unit gap p/q forces p to stay. C15 replaces the printed repeated-time tautology explicitly;
    hxs supplies the standing sorted domain.
  thm-dimensional-reduction: 'dimred-corrected-arxiv.tex:109-118 (label the_theorem, clause finite dimensional
    reduction). The first display of Theorem 1.1(i), unchanged: N>=1, upper dimension d+1>=2, t>=1, lower
    x in the sorted fundamental domain; append the literal coordinate 1. Uniform heights are 2 times the
    respective dimensions.'
  thm-terminal-reduction: 'dimred-corrected-arxiv.tex:119-121 (label the_theorem, clause terminal dimensional
    reduction). The second display of Theorem 1.1(i), unchanged: under the same size/dimension domain
    and every x_i>=2, append 2 and equate terminal ENat odometers. Positive-dimensional stabilization
    proves finiteness; it is not a new premise.'
  cor-sandpile-reduction: dimred-corrected-arxiv.tex:147-154 (label sandpile_corollary, clause terminal
    pile reduction). The full terminal pile identity +2 on legal cube sites, retaining x_i>=2. Corrected.terminalPile
    requires positive dimension; cubeSnocOne and cubeSimplexSite retain the literal source coordinates.
    Their proof arguments are geometric typing evidence, not added hypotheses. The eventual finite-time
    characterization discharges all ENat conversions.
  lem-symmetry: 'dimred-corrected-arxiv.tex:394-396 (label symmetry_lemma). Both source conclusions, jointly:
    every physical odometer symmetry and equality with the independent folded threshold process on the
    sorted domain. CubeSymmetric requires the initial pile to be symmetric only inside the cube. No height
    premise. Directed occurrences retain multiplicity, and the physical embedding handles both parities.'
  prop-no-reduction: dimred-corrected-arxiv.tex:643-645 (label no_reduction). M=1 and d0>=2, with dimension-dependent
    constant heights 2d+(d0-1). The terminal odometers equal 1 at every site in dimension d0 and 2 at
    every site in dimension d0-1. Both full cube domains are quantified.
  lem-radial-laplacian: dimred-corrected-arxiv.tex:665-671 (label radial_laplacian). At radial index k<=d
    on N=4, retain the exact coefficients -d-k,d-k,k for every constant integer height. At k=0 the truncated
    predecessor is multiplied by zero; at k=d the successor is multiplied by zero. There is no assertion
    that radial d (d+1) is an exterior site.
  lem-pt-ind: 'dimred-corrected-arxiv.tex:291-297 (label pt_ind_lemma). C02: initial pile signed and bounded
    above by 4d-1 only on the cube, with d>=1. The next odometer is max zero of the floor quotient, at
    each in-cube site and every time. Int division is mathematical floor because 2d>0. No nonnegativity
    premise remains.'
  lem-parabolic-comparison: dimred-corrected-arxiv.tex:314-319 (label parabolic_comparison). C03 retains
    the pointwise least-action statement under the signed upper bound only. First v satisfies the parabolic
    inequality at t+1; then every nonnegative zero-extended feasible trajectory dominates v. Competitors
    may have arbitrary nonnegative values at time zero.
  lem-topple-limit: 'dimred-corrected-arxiv.tex:599-606 (label topple_limit). C11: for d>=1,M>=1 and every
    integer pile with cube-local initial symmetry, every time-window maximum contracts from t0 to t>=t0,
    for all j>=0. No height bounds or global initial symmetry remain. Both maxima are genuine nonempty
    sup-prime values. M>=1 is the physical nonempty source domain, not a convenience hypothesis. The unrestricted
    threshold proof supplies contraction independently of the regularity induction.'
  lem-difference-comparison: 'dimred-corrected-arxiv.tex:457-478 (label general_difference_comparison).
    C06/C07: arbitrary constant integer height; finite simultaneous w/g family, initial bounds and superharmonicity.
    At each boundary point retain the outer all-index OR. Physical translated-site membership belongs
    only to the first neighbor-sum alternative. The second alternative is the next-step difference bound,
    with no membership restriction. All times t>=t0 and every source index remain in the conclusion.'
  prop-base-case: 'dimred-corrected-arxiv.tex:699-723 (label prop:base_case). C12/C13: retain both firing-block
    clauses for all t>=1 and the bounded shifted ripple profile for 1<=tprime<tabs<=tprime+x. Lean writes
    tabs=t+1,tprime=s+1, so the shift is t-s and its nonnegativity bound is t-s<=x. a0=a1=d; the first
    reference-time window is empty. No unrestricted ripple conclusion. C14 arithmetic is checked separately.'
  prop-base-dimension-consistency: dimred-corrected-arxiv.tex:811-813 (label base_dimension, clause self-similarity).
    For d>=1,M>=2, every 1<=j<=M, t<=tau_j and sorted x with every coordinate >M-j, the exact literal
    translation gives equal uniform odometers. Includes j=M and t=0 as the printed proposition does.
  prop-base-dimension-strong-derivative: 'dimred-corrected-arxiv.tex:827-829 (label base_dimension, clause
    strong derivative). C16: bind the precise legal facet p=(head,1,ones), dimension i+1+j, head coordinates
    >=2. The constant-two pure difference is at p and p+2e, not at an arbitrary unbound point. The source
    regime is t<tau_M or (i>=1 and tau_M<=t). The far value is ambient and zero-extended when exterior.'
  prop-base-dimension-strong-facet: 'dimred-corrected-arxiv.tex:831-839 (label base_dimension, clause
    both strong compatibility conclusions). C17 retains both conclusions: a current unit gap at the same
    legal facet forces the base to stay and the raised site to fire. The tail subscript and dimension
    are explicit. Preserve the early empty-head restriction and the all-time nonempty-head regime; no
    current compatibility premise is assumed in the proof.'
  prop-base-dimension-strong-topple: dimred-corrected-arxiv.tex:845-847 (label base_dimension, clause
    strong topple control). For d>=1,M>=2 and t>=tau_(M-1), the maximum of the two-step increments on
    the full sorted domain is <=1. Corrected.maximum uses the constructed nonempty domain, whose all-ones
    witness follows from M>=2. No default maximum is exported.
  thm-self-similarity: 'dimred-corrected-arxiv.tex:122-133 (label the_theorem, clause self-similarity
    and hitting time). Theorem 1.1(ii), unchanged apart from explicit existential hitting-time convention
    C01: all j<M, t<=tau_j and x_i>M-j on the full sorted domain. Retain d>=2. Small-j domains are empty
    consequences of the printed inequalities, not added exclusions.'
  cor-sandpile-self-similarity: dimred-corrected-arxiv.tex:155-158 (label sandpile_corollary, clause finite
    pile self-similarity). The full finite pile equality on the original and translated physical cube
    carriers, with the printed strict margin x_i>M-j+1. Corrected.pile is evaluated only in each cube.
    cubeShiftedSite retains x-(M-j); no j>=1 premise is added.
  cor-axis-monotonicity: 'dimred-corrected-arxiv.tex:523-533 (label axis_monotonicity). C08/C09: retain
    elementary reflection e_i and rotation e_i-e_j for i<j, represented by J.card<=1 and I={i}. Arbitrary
    constant integer c, t>=1 and both source/shifted sorted domains. No artificial height bound. Arbitrary
    unbalanced mixed sets are explicitly withdrawn, not silently assumed.'
  cor-derivative-bound: 'dimred-corrected-arxiv.tex:552-559 (label cor:derivative_bound). C10: retain
    the genuine terminal corner cap vInf(corner)<=kM, k>=1, before all directions,times,sites. Every constant
    integer c is allowed. Conclude every coordinate first difference <=k*x_j on the sorted domain. The
    terminal cap produces all finite-time corner caps inside the proof.'
  lem-strict-head-facet: 'dimred-corrected-arxiv.tex:1218-1228 (label lem:strict-head-facet). C20 new
    lemma: on the unsorted orthant 1<=x_i<=M, d>=1,M>=2,t>=0, strict-nonmax pure second differences are
    <=2*x_k. Jointly, a coordinate-one facet with a nonempty head and unit gap has BOTH next firing conclusions.
    No tau, current reduction, conditional induction bundle, mixed-axis assumption or dissipating cap
    is a premise. Existential head witnesses express strict maxima on the finite coordinate domain.'
  lem-one-terminal-profile: 'dimred-corrected-arxiv.tex:1004-1011 (label lem:one-terminal-profile, clause
    quadratic profile). C21 first clause: M>=1 and the whole legal interval 1<=x_0<=M. The terminal odometer
    equals the nonnegative integral quadratic numerator divided by two, represented in ENat by a natural
    cast. The numerator is nonnegative on this carrier; Int.toNat introduces no fallback value.'
  lem-one-terminal-derivative: 'dimred-corrected-arxiv.tex:1004-1011 (label lem:one-terminal-profile, clause
    full derivative including endpoint). C21 second clause: the same full interval including x=M. The
    terminal ENat values are finite by positive-dimensional stabilization. The endpoint x+1=M+1 has the
    genuine zero exterior odometer; the value at M is M. Includes M=1; no strict-interior restriction.'
  char-folded-lift: 'dimred-corrected-arxiv.tex:371-374 (literal lifted-value definition; context subsec:symmetry).
    Literal defining equation of the lifted value on every site of Z^d: the value at the orbit representative inside the cube, and zero outside it, as in the source. A definition, not a numbered result of the paper.'
  char-folded-neighbors: 'dimred-corrected-arxiv.tex:375-379 (literal neighbour-sum definition; context subsec:symmetry). Literal defining equation of R: for each coordinate, the lifted values at both neighbours x+e_i and x-e_i. Neighbours with the same orbit representative give separate summands. A definition, not a numbered result of the paper.'
  char-folded-odometer: dimred-corrected-arxiv.tex:379-383 (literal initial value and threshold recursion;
    context subsec:symmetry). The literal initial value and recursion of the symmetrized odometer on the whole sorted domain, for initial heights of every sign, through the neighbour sum R. Its identification with the odometer is the second conclusion of lem-symmetry.
    A definition, not a numbered result of the paper.
  char-physical-pile: dimred-corrected-arxiv.tex:93-98 (finite-pile conservation; physical carrier at
    278-284). The physical finite-time pile is initial height plus the odometer Laplacian, on a CubeSite.
    This literal body is equivalent to the source mutual recursion by odo_succ_eq and sandp_succ. No ambient-site
    pile value is supplied. A definition, not a numbered result of the paper.
  char-terminal-pile: dimred-corrected-arxiv.tex:145-161 (label sandpile_corollary, which uses the terminal
    pile s_infinity). The unit records only the defining equation on a positive-dimensional physical cube site,
    namely that the terminal pile is 2d plus the Laplacian of the final odometer, which is the telescoped form of the
    recursion at dimred-corrected-arxiv.tex:95-96 with s_0 = 2d and v_0 = 0. Finiteness of the final odometer
    and eventual agreement with the finite-time pile are Support lemmas (DimRed.Corrected.odoInfUnif_ne_top,
    DimRed.Corrected.terminalPile_eventually), not part of this unit. A definition, not a numbered result of the paper.
  char-nonempty-maximum: 'dimred-corrected-arxiv.tex:599-606 (label topple_limit, clause nonempty-maximum
    semantic unit). Literal maximum body on a finite domain with an explicit Nonempty witness: sup-prime,
    with no empty-domain branch. Geometric simplexNonempty constructs the witness at every source maximum
    use. A definition, not a numbered result of the paper.'
