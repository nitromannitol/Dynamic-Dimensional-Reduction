hazards:
  lem-one-terminal-profile:
    toNat: The integral quadratic is nonnegative on 1<=x_0<=M; odoInf_one_eq proves the ENat equality
      on exactly that carrier.
  lem-one-terminal-derivative:
    toNat: Positive-dimensional uniform stabilization gives odoInfUnif_ne_top for every site, including
      the exterior. The endpoint uses the exterior zero theorem.
  char-terminal-pile:
    toNat: The carrier requires 1 <= d, and positive-dimensional uniform stabilization gives
      odoInfUnif_ne_top at every site, so toNat never meets the infinite value.
