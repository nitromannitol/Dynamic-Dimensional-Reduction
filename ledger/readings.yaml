# Clause readings, exponent waivers and the paper's exponent vocabulary.
#
# Every node is read against `paper/dimred.tex` (line numbers are those of the
# pinned file in `ledger/manifest.yaml`).  A reading says what the paper
# asserts, what the frozen Lean statement asserts, and how they correspond:
# parameter ranges, which display is which conjunct, and every place where the
# Lean statement carries something the paper leaves implicit or drops something
# the paper says.  Schema: tools/leanform/leanform_tools/readings.py.
#
# Notation common to all readings.  The paper writes v_t^{(d,N)} for the parallel
# toppling odometer of s_0 = 2d on the d-dimensional hypercube of side N
# (dimred.tex:98), and from dimred.tex:434-436 on it works on the sorted
# fundamental domain S_M^{(d)} of C_{2M}^{(d)}.  In Lean that odometer is
# `odoUnif d N t` (or `odo d N s0 t` for a general constant pile), evaluated
# on the cube and equal on S_M^{(d)} to the paper's v_t by the symmetry lemma.
# Vector inequalities are coordinatewise (dimred.tex:273).

clauses:
  prop-base-dimension-weak: >-
    Paper (Proposition 4.1, weak facet compatibility, dimred.tex:919-926): for M >= 2 and d >= 1,
    all x_i >= 2, t >= 1, i >= 0, j >= 0 with i+j+1 = d, if v_t^{(M)}(x_i,1,1_j) =
    v_t^{(M)}(x_i,2,1_j) + 1 then v_{t+1}^{(M)}(x_i,1,1_j) = v_t^{(M)}(x_i,1,1_j).  Lean is exactly
    that one implication, with the dimension written i+1+j, x : Fin i -> Z with every coordinate >= 2,
    (x_i,c,1_j) spelled facetPoint x c j, the premise as hypothesis h and the odometer as
    odoUnif (i+1+j) (2*M); the only addition is hxs, that (x_i,1,1_j) lies in S_M^{(i+1+j)}, which
    is the paper's standing domain for every point named from dimred.tex:434-436 on
    (CORRESPONDENCE.md, "The domain of the regularity statements"), and (x_i,2,1_j) then lies in it
    too because x_i >= 2 and M >= 2.  The paper's 3 assertion units (one item, two displayed
    equalities) are this single implication; no mismatch.
  thm-dimensional-reduction: >-
    Paper (Theorem 1.1, dimred.tex:109-140, N >= 1, d >= 2, M = ceil(N/2)): clause 1 asserts, for all
    t >= 1 and x_{d-1} in S_M^{(d-1)}, v_t^{(d,N)}(x_{d-1},1) = v_t^{(d-1,N)}(x_{d-1}), then a second
    display for v_infinity, then clause 2.  This node is the first display only (the other two are
    thm-terminal-reduction and thm-self-similarity, which is why the heuristic counts 10 paper units
    against 1 conjunct).  Lean writes d+1 for d, so d >= 2 is hd : 1 <= d, x : Site d lies in
    inSimplex d (sideHalf N) (sideHalf N = ceil(N/2)), Fin.snoc x 1 appends the last coordinate 1,
    and both sides are odoUnif (s_0 = 2d in each dimension separately, dimred.tex:35); faithful.
  thm-terminal-reduction: >-
    Paper (Theorem 1.1 clause 1, second display, dimred.tex:119-121): for x_{d-1} >= 2,
    v_infinity^{(d,N)}(x_{d-1},2) = v_infinity^{(d-1,N)}(x_{d-1}), under the theorem's N >= 1, d >= 2;
    the sentence itself says only x_{d-1} >= 2 and inherits x_{d-1} in S_M^{(d-1)} from the display
    before it.  Lean is that display with d written d+1: hd : 1 <= d, x in inSimplex d (sideHalf N)
    with every coordinate >= 2 (hx2), and odoInfUnif (d+1) N (Fin.snoc x 2) = odoInfUnif d N x, where
    v_infinity is the supremum of v_t valued in N-infinity (its finiteness is a theorem of the
    development, not assumed); faithful, the inherited domain being the only implicit piece.
  cor-sandpile-reduction: >-
    Paper (Corollary 1.1, dimred.tex:143-159, same N >= 1, d >= 2, M as the theorem): clause 1 asserts
    s_infinity^{(d,N)}(x_{d-1},1) = s_infinity^{(d-1,N)}(x_{d-1}) + 2 for x_{d-1} in S_M^{(d-1)} with
    x_{d-1} >= 2, and clause 2 is self-similarity (node cor-sandpile-self-similarity).  Lean is
    clause 1 with d written d+1: hd : 1 <= d, x in inSimplex d (sideHalf N), hx2 : every coordinate
    >= 2, and sandpInfUnif (d+1) N (Fin.snoc x 1) = sandpInfUnif d N x + 2, where sandpInfUnif is
    2d + Laplacian of the terminal odometer, the paper's s_infinity = s_0 + Delta v_infinity;
    faithful, hypotheses and conclusion correspond one to one.
  lem-symmetry: >-
    Paper (Lemma 2.3, dimred.tex:415-417): for each t >= 0 and each sigma in Aut_{C_d}, sigma v_t = v_t,
    for a symmetric initial sandpile (dimred.tex:369); "hence v_t = v_t^S on S_M^{(d)}".  Lean states
    the first sentence only: for every t, coordinate permutation pi and reflection pattern eps
    (cubeSym, the signed permutation matrices followed by the translation preserving the cube) and
    every x, odo d N s0 t (cubeSym d N pi eps x) = odo d N s0 t x, under hsym : IsSymmetricPile d N s0.
    Two differences, neither a weakening: the second sentence is not a Lean conjunct (the
    development never defines v^S, the identification is recorded in CORRESPONDENCE.md, "The
    symmetrized odometer"), and the hypothesis and conclusion are for functions on all of Z^d rather
    than on C, which is the same content since the odometer reads s_0 only on the cube and cubeSym
    preserves the cube; the bound 0 <= s_0 <= 2(2d)-1 is not carried because the proof does not use it.
  prop-no-reduction: >-
    Paper (Proposition 3.1, dimred.tex:706-708, in the M = 1 subsection so N = 2, d_0 >= 2): with
    s_0^{(d)} = 2d + (d_0-1), v_infinity^{(d_0)} = 1 everywhere but v_infinity^{(d_0-1)} = 2 everywhere.
    Lean has two conjuncts over the cube C_2: in dimension d_0 with constant pile 2*d_0 + (d_0-1),
    odoInf d_0 2 _ x = 1 for every x in the cube (first conjunct, the claim for v^{(d_0)}), and in
    dimension d_0-1 with constant pile 2*(d_0-1) + (d_0-1), odoInf (d_0-1) 2 _ x = 2 for every x in
    the cube (second conjunct, the claim for v^{(d_0-1)}); hd_0 : 2 <= d_0 makes d_0 - 1 an honest
    predecessor.  Faithful; the paper's "≡" is "for every site of the cube".
  lem-radial-laplacian: >-
    Paper (Lemma 3.1, dimred.tex:728-734, M = 2 so N = 4, d >= 1): with v_t(d+1) = v_t(-1) = 0 and
    v_t(x) the odometer at (2_x,1_{d-x}), Delta v_t(x) = (-d-x) v_t(x) + (d-x) v_t(x+1) + x v_t(x-1).
    Lean: for every d, every constant pile c, every t and k <= d, lap (odo d 4 (fun _ => c) t)
    (radial d k) = (-d-k) v(radial d k) + (d-k) v(radial d (k+1)) + k v(radial d (k-1)), with
    radial d k = (2_k,1_{d-k}).  The paper's boundary convention is not stated because it is not
    needed: at k = d the coefficient of the (d+1) term is d-k = 0 and at k = 0 the coefficient of the
    (-1) term is k = 0, so the truncated index is multiplied by zero.  The Lean statement is the
    paper's identity for any constant pile (the proof uses only symmetry) and also at d = 0, a
    harmless generalization; the heuristic's 2 paper units include a commented-out display at
    dimred.tex:731.
  lem-pt-ind: >-
    Paper (Lemma 2.1, dimred.tex:289-294, with the subsection's standing hypothesis
    0 <= s_0 <= 2(2d)-1 on C, dimred.tex:288): for each x in C and all t >= 0,
    v_{t+1}(x) = floor((s_0(x) + sum_{y~x} v_t(y)) / 2d).  Lean: for d >= 1, s0 bounded as in hs0 and
    hs1 on the cube only, x in the cube and every t, odo d N s0 (t+1) x = (s0 x + nbrSum (odo d N s0 t) x)
    / (2*d), integer division being floor division for a positive divisor and nbrSum the sum over the
    2d neighbours with the odometer zero off the cube (the paper's padding); faithful, with the
    bounds required only on the cube where the paper states them.
  lem-parabolic-comparison: >-
    Paper (Lemma 2.2, dimred.tex:311-316, same standing hypothesis 0 <= s_0 <= 2(2d)-1): v(t,x) is the
    minimum over u : G -> Z^+, G = Z^+ x C, of those u with Delta^G u(t,x) + s(t,x) <= 2d-1 for all
    x in C and t >= 1, where Delta^G f(t,x) = -2d f(t,x) + sum_{y~x} f(t-1,y) and s(t,x) = s_0(x).  Lean
    states a minimum as its two halves: the first conjunct is that v satisfies the constraint at every
    t+1 >= 1 and x in the cube, the second is that every u >= 0 vanishing off the cube and satisfying
    the constraint has odo t y <= u t y for all t and y.  The time index is t+1 so that t >= 1 needs no
    subtraction, u(0,.) is unconstrained exactly as in the paper, and the sum over neighbours in C is
    nbrSum of a function that is zero off the cube; faithful.
  lem-topple-limit: >-
    Paper (Lemma 2.5, dimred.tex:669-676, S = S_M^{(d)}): for all t >= t_0 and j >= 0,
    max_{z in S}(v_{t+j}(z) - v_t(z)) <= max_{z in S}(v_{t_0+j}(z) - v_{t_0}(z)).  Lean: the same
    inequality with simplexMax d M, on the cube C_{2M} as the paper fixes N = 2M (dimred.tex:435),
    carrying the standing hypotheses d >= 1, 0 <= s_0 <= 2(2d)-1 on the cube and, added in version 2
    (CORRESPONDENCE.md), that s_0 is symmetric, which is what lets a maximum over the fundamental
    domain stand for the whole cube.  simplexMax is 0 on an empty domain, but S_M^{(d)} is nonempty
    for M >= 1 and both sides are 0 at M = 0, so nothing is lost; faithful.
  lem-difference-comparison: >-
    Paper (Lemma 2.4, dimred.tex:473-492, s_0 constant with 0 <= s_0 <= 2(2d)-1, N = 2M): given points
    w_1..w_n in Z^d with g_j : S -> Z superharmonic in the interior of S, if sup_j (D_w_j v_{t_0} - g_j)
    <= 0 on S and, for all t >= t_0 and x in B_0 u B_w, either the neighbour-sum inequality with
    x + w_j in C_N for all j or sup_j (D_w_j v_{t+1} - g_j)(x) <= 0, then sup_j (D_w_j v_{t+1} - g_j) <= 0
    for all t >= t_0, x in S.  Lean: w and g indexed by Fin n (a supremum over the finite index set is
    at most zero exactly when every term is, and the empty index is vacuous on both sides), hg is
    SuperharmonicIn, hinit the t_0 condition, hbdry the boundary dichotomy with bdry M 0 x or bdry M (w k) x
    for B_0 u B_w, whose three pieces dispBoundary, refBoundary and rotBoundary are the paper's
    (x+w)_i >= M, <= 1 and (x+w)_i <= (x+w)_j for i<j, and the conclusion at every t >= t_0 and x in
    S; the constant pile is c with hc0, hc1 and D_w v(x) = v(x) - v(x+w).  Faithful.
  prop-base-case: >-
    Paper (Proposition 3.2, dimred.tex:789-813, M = 2 so N = 4, d >= 1, s_0 = 2d + (d-1), v_t(x) the
    odometer at (2_x,1_{d-x}) for 0 <= x <= d): for all t >= 1, v_t(x) = v_{t-1}(x) + 1 for x <= a_t
    and v_t(x) = v_{t-1}(x) for a_t < x <= a_{t-1} (display eq:continuous_block), and for
    t' < t <= t'+x with a_{t'-1} >= x > a_t', v_t(x) = v_t'(x-(t-t')) (display eq:ripple).  Lean
    writes t+1 for t and s+1 for t' so no truncated subtraction is needed: the first conjunct is
    the block display (its two cases are the two implications, x <= a_{t+1} and a_{t+1} < x <= a_t),
    the second is the ripple display (s+1 <= t and t-s <= x are t' < t <= t'+x, and x <= a_s,
    a_{s+1} < x are a_{t'-1} >= x > a_t'), all for x <= d, with a_t = blockEdge d t, blockEdge d 0 = d
    matching the paper's a_0 := d (dimred.tex:853) and blockEdge d 1 = d; faithful.
  prop-base-dimension-consistency: >-
    Paper (Proposition 4.1, self-similarity, dimred.tex:915-918, for M >= 2 and d >= 1): for each
    1 <= j <= M and t <= tau_j, v_t^{(M)}(x) = v_t^{(j)}(x-(M-j)) for x > M-j.  Lean: hd, hM : 2 <= M,
    1 <= j <= M, t <= toppleTime d j as an inequality in N-infinity, x in inSimplex d M with every
    coordinate > M-j, and odoUnif d (2*M) t x = odoUnif d (2*j) t (x - (M-j)) coordinatewise; the
    superscripts (M) and (j) are the half-sides 2*M and 2*j of the two cubes.  Faithful, and it
    includes j = M (trivial), which the paper's 1 <= j <= M also includes, unlike Theorem 1.1's j < M.
  prop-base-dimension-strong-derivative: >-
    Paper (Proposition 4.1, strong facet compatibility, display base_dimension:strong_derivative,
    dimred.tex:927-931): for x_i >= 2, j >= 0, i < d and (t < tau_M and i >= 0) or (i >= 1 and
    t >= tau_M), v_t^{(M)}(x) - v_t^{(M)}(x + 2 e_{i+1}) <= 2.  The display leaves the bold x unbound,
    and read as all x in S_M it would be stronger than what the proof establishes, which bounds
    v_t(x) - v_t(x+2e_i) by 2 x_i (dimred.tex:1322-1325); Lean takes x = (x_i,1,1_j) so that
    x + 2 e_{i+1} = (x_i,3,1_j), which is eq:two_derivative_bound at dimred.tex:1263-1265, the
    form the paper proves and uses.  Lean:
    d = i+1+j (so i < d is automatic, and the paper never ties d to i and j in this clause), hx2, hxs
    (the point lies in S_M), hreg the regime as written, conclusion odoUnif ... (facetPoint x 1 j) -
    odoUnif ... (facetPoint x 3 j) <= 2.  FLAGGED: the paper's display is ambiguous and Lean fixes
    it; the disambiguation is recorded in ledger/decisions.md.
  prop-base-dimension-strong-facet: >-
    Paper (Proposition 4.1, strong facet compatibility, display base_dimension:strong_compatability,
    dimred.tex:932-940, same hypotheses and regime as the derivative display before it): if
    v_t^{(M)}(x_i,1,1_j) = v_t^{(M)}(x_i,2,1_j) + 1 then v_{t+1}^{(M)}(x_i,1,1_j) = v_t^{(M)}(x_i,1,1_j)
    and v_{t+1}^{(M)}(x_i,2,1_j) = v_t^{(M)}(x_i,2,1_j) + 1.  Lean: same binders and the same
    hreg, hx2, hxs as the derivative node (the paper's preamble covers both displays), h the premise,
    and the two equalities of the aligned display as the two conjuncts, in the order written; faithful.
  prop-base-dimension-strong-topple: >-
    Paper (Proposition 4.1, strong topple control, dimred.tex:944-948, M >= 2, d >= 1): for all
    t >= tau_{M-1}, sup_{x in S_M}(v_{t+2}(x) - v_t(x)) <= 1.  Lean: hd, hM : 2 <= M, toppleTime d (M-1)
    <= t in N-infinity (vacuous if no such time exists, as in the paper), and simplexMax d M of
    odoUnif d (2*M) (t+2) - odoUnif d (2*M) t being at most 1, the supremum over the finite domain being
    a maximum; faithful.
  thm-self-similarity: >-
    Paper (Theorem 1.1 clause 2, dimred.tex:122-130, N >= 1, d >= 2, M = ceil(N/2)): for all j < M,
    t <= tau_j and x in S_M^{(d)} with x > M-j, v_t^{(d,N)}(x) = v_t^{(d,2j)}(x-(M-j)), where tau_j is the
    first t >= 1 at which v_t^{(d,2j)} reaches j at some site of the inner boundary of C_{2j}^{(d)}.
    Lean: hN, hd : 2 <= d, j < sideHalf N, t <= toppleTime d j in N-infinity (toppleTime is an infimum
    over t >= 1 and the inner boundary, top if the set is empty), x in inSimplex d (sideHalf N) with
    every coordinate > M-j, and odoUnif d N t x = odoUnif d (2*j) t (x - (M-j)) coordinatewise; j = 0 is
    vacuous since x > M contradicts x in S_M.  Faithful.
  cor-sandpile-self-similarity: >-
    Paper (Corollary 1.1 clause 2, dimred.tex:153-156): for all j < M, t <= tau_j and x in S_M^{(d)} with
    x > M-j+1, s_t^{(d,N)}(x) = s_t^{(d,2j)}(x-(M-j)); note the threshold M-j+1, one more than the odometer
    statement, the domain being shrunk by one as dimred.tex:166 says.  Lean has the same
    binders as thm-self-similarity with hxgt : every coordinate > M-j+1 and conclusion
    sandpUnif d N t x = sandpUnif d (2*j) t (x - (M-j)); sandpUnif is s_0 + Laplacian of the
    odometer, the paper's s_t.  Faithful.
  cor-axis-monotonicity: >-
    Paper (Corollary 2.1, dimred.tex:513-527, constant s_0 and N = 2M): for t >= 1, x in S, every index
    1 <= i <= d and every J empty or {j} with i < j <= d, v_t(x) >= v_t(x + e_i - e_J) whenever
    x + e_i - e_J is in S.  Lean: the constant pile c with hc0, hc1, t with _ht : 1 <= t, x in
    inSimplex d M, i : Fin d, J a finset of card <= 1 all of whose elements exceed i, hmem the
    membership of x + unit i - sum over J, and the odometer inequality in the same direction;
    faithful (the t >= 1 is carried although the proof does not use it).
  cor-derivative-bound: >-
    Paper (Corollary 2.2, dimred.tex:531-538, constant s_0 and N = 2M): if v_infinity(M,1_{d-1}) <= kM
    for an integer k >= 1 then for all 1 <= j <= d and t >= 0, v_t(x) - v_t(x+e_j) <= k x_j, x in S.  Lean:
    k : N with 1 <= k fixed before j, t and x as in the paper, hcorner : odoInf at cornerPoint d M
    (the point (M,1_{d-1})) <= k*M in N-infinity, j : Fin d, any t, x in inSimplex d M, and
    odo t x - odo t (x + unit j) <= k * x j, with the constant pile c of hc0, hc1; faithful (x + e_j may
    leave S, where the odometer is the cube's, zero off the cube, as in the paper's padding).

constants: {}

exponents:
  prop-base-dimension-weak:
    - kind: notation
      detail: >-
        The four superscripts (M) in v_t^{(M)} (dimred.tex:922, 924) are the half-side index of the
        cube C_{2M}^{(d)} whose fundamental domain S_M^{(d)} carries the odometer (dimred.tex:436 defines
        v_t^{(d,M)} for exactly this; d is suppressed in Section 4), not powers.  Lean carries M as
        the explicit argument 2 * M of odoUnif (i + 1 + j) (2 * M), which contains no caret.
  thm-dimensional-reduction:
    - kind: notation
      detail: >-
        Every superscript in dimred.tex:109-140 is a dimension or size index, not a power: (d) and
        (d-1) on C and S (lines 110, 111, 114, 122, 128, 130) and (d,N), (d-1,N), (d,2j) on v
        (lines 116, 120, 124, 128), the last being what dimred.tex:98 calls "dependence on d and N".
        Lean carries them as explicit arguments of odoUnif d N, inSimplex d, toppleTime d j and
        innerBoundary d.
    - kind: split
      detail: >-
        Lines 109-140 are the whole theorem; this node states only the first display of clause 1
        (line 116), so the superscripts of the second display (line 120) and of clause 2 (lines
        122-130) belong to thm-terminal-reduction and thm-self-similarity.
    - kind: context
      detail: >-
        The two (d,M) occurrences on line 133 lie in a commented-out display (dimred.tex:131-134, every
        line begins with a percent sign), which the extractor does not strip; they are not in the
        typeset theorem.
  thm-terminal-reduction:
    - kind: notation
      detail: >-
        Every superscript in dimred.tex:109-140 is a dimension or size index, not a power: (d) and
        (d-1) on C and S (lines 110, 111, 114, 122, 128, 130) and (d,N), (d-1,N), (d,2j) on v
        (lines 116, 120, 124, 128), the last being what dimred.tex:98 calls "dependence on d and N".
        For this node's display (line 120) Lean carries (d,N) and (d-1,N) as the explicit arguments
        of odoInfUnif (d + 1) N and odoInfUnif d N, and (d-1) as inSimplex d.
    - kind: split
      detail: >-
        Lines 109-140 are the whole theorem; this node states only the second display of clause 1
        (line 120), so the superscripts of the first display (line 116) and of clause 2 (lines
        122-130) belong to thm-dimensional-reduction and thm-self-similarity.
    - kind: context
      detail: >-
        The two (d,M) occurrences on line 133 lie in a commented-out display (dimred.tex:131-134, every
        line begins with a percent sign), which the extractor does not strip; they are not in the
        typeset theorem.
  cor-sandpile-reduction:
    - kind: notation
      detail: >-
        Every superscript in dimred.tex:143-159 is a dimension or size index, not a power: (d-1) on S
        (line 149), (d,N) and (d-1,N) on s_infinity (line 151), (d) on S (line 153), (d,N) and (d,2j)
        on s_t (line 155); dimred.tex:146 says the notation is that of Theorem 1.1.  Lean carries them
        as explicit arguments of sandpInfUnif (d + 1) N, sandpInfUnif d N and inSimplex d.
    - kind: split
      detail: >-
        Lines 143-159 hold both clauses of the corollary; this node states clause 1 (lines 149-152),
        so the superscripts of clause 2 (lines 153-156) belong to cor-sandpile-self-similarity.
  lem-symmetry:
    - kind: notation
      detail: >-
        The only superscript is the (d) of S_M^{(d)} in the second sentence (dimred.tex:416), the
        fundamental domain of the d-dimensional cube: a dimension index, carried in Lean as the
        explicit argument d of odo and cubeSym.  That second sentence is itself not a Lean conjunct
        (see the clauses reading and CORRESPONDENCE.md), so this waiver covers the notation only.
  prop-no-reduction:
    - kind: notation
      detail: >-
        The three superscripts on dimred.tex:707 are dimension indices: (d) in s_0^{(d)} (the pile
        2d + (d_0-1) in dimension d), (d_0) in v_infinity^{(d_0)} and (d_0-1) in v_infinity^{(d_0-1)},
        the odometers in dimensions d_0 and d_0-1.  Lean carries them as the explicit arguments d₀
        and d₀ - 1 of odoInf and of the constant pile (fun _ => 2 * d + (d₀ - 1)), with the cube side
        2 (M = 1); none is a power.
  prop-base-case:
    - kind: notation
      detail: >-
        The only superscript in dimred.tex:789-813 is the (d) of s_0^{(d)} = 2d + (d-1) on line 790,
        the dimension of the pile; the radially reparametrized v_t(x) carries none.  Lean carries d
        as the explicit argument of odo d 4 and of the pile fun _ => 2 * d + (d - 1).
  prop-base-dimension-consistency:
    - kind: notation
      detail: >-
        The superscript (M) of v_t^{(M)} on dimred.tex:917 is the half-side of the cube C_{2M}^{(d)}
        (dimred.tex:436), not a power; Lean carries it as 2 * M in odoUnif d (2 * M).  The companion
        (j) of v_t^{(j)} is the same kind of index, carried as 2 * j, and is already in the noise list.
  prop-base-dimension-strong-derivative:
    - kind: notation
      detail: >-
        The two superscripts (M) on dimred.tex:930 are the half-side of the cube C_{2M}^{(d)}
        (dimred.tex:436), not powers; Lean carries M as 2 * M in odoUnif (i + 1 + j) (2 * M).
  prop-base-dimension-strong-facet:
    - kind: notation
      detail: >-
        The six superscripts (M) on dimred.tex:935, 937, 938 are the half-side of the cube
        C_{2M}^{(d)} (dimred.tex:436), not powers; Lean carries M as 2 * M in
        odoUnif (i + 1 + j) (2 * M).
  thm-self-similarity:
    - kind: notation
      detail: >-
        Every superscript in dimred.tex:109-140 is a dimension or size index, not a power: (d) and
        (d-1) on C and S (lines 110, 111, 114, 122, 128, 130) and (d,N), (d-1,N), (d,2j) on v
        (lines 116, 120, 124, 128), the last being what dimred.tex:98 calls "dependence on d and N".
        For this node's clause (lines 122-130) Lean carries (d,N) and (d,2j) as the explicit arguments
