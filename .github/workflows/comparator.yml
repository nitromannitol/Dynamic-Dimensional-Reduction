name: Comparator audit

# Runs the official leanprover/comparator on every Audit/<X>/comparator.json: for each
# pair it checks that Solution proves statements whose full dependency
# closure matches Challenge's, uses only the permitted axioms, and is
# accepted by BOTH the Lean kernel (replay) and the independent nanoda
# kernel (enable_nanoda is switched on for this run only).
#
# Mathlib olean artifacts come from `lake exe cache get`.  The project's own
# build and the Lattice-Probability build are cached between runs; the first
# run on an empty cache builds the whole DimRed library.

# Manual dispatch only until the public release: these builds are Mathlib-scale, so they run
# on request.  The release adds `push: branches: [main]`.  There is no `pull_request` trigger.
on:
  workflow_dispatch:

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPARATOR_REV: "575674928e239f5bc452aab72d1dd7b0f1326494"  # leanprover/comparator
  LEAN4EXPORT_REV: "v4.32.0"                                  # MUST match ./lean-toolchain
  NANODA_REV: "6ae1f0cd962f081f6c423454c5da729d841236a7"      # ammkrn/nanoda_lib
  LANDRUN_REV: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"     # Zouuup/landrun (v0.1.18)

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Lattice-Probability is private: read it with the repository's deploy key.
      - name: Read access to Lattice-Probability
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LP_DEPLOY_KEY }}
      - name: Fetch Lattice-Probability over SSH
        run: |
          git config --global url."git@github.com:nitromannitol/Lattice-Probability".insteadOf "https://github.com/nitromannitol/Lattice-Probability"

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Restore/save are split so the save runs even when a later step fails,
      # banking completed modules.
      - name: Restore project and dependency build artifacts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/lattice-probability/.lake/build
          key: lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Get the Mathlib cache
        run: lake exe cache get

      - name: Build the library and the audit surfaces
        run: lake build Audit

      - name: Restore verification tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Build comparator
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator ~/tools/comparator
          git -C ~/tools/comparator checkout "$COMPARATOR_REV"
          cd ~/tools/comparator && lake build

      - name: Build lean4export (toolchain-matched)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export ~/tools/lean4export
          git -C ~/tools/lean4export checkout "$LEAN4EXPORT_REV"
          test "$(cat ~/tools/lean4export/lean-toolchain)" = "$(cat lean-toolchain)" \
            || { echo "lean4export toolchain does not match project toolchain"; exit 1; }
          cd ~/tools/lean4export && lake build

      - name: Set up Go (for landrun)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build landrun (static)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Zouuup/landrun ~/tools/landrun-src
          git -C ~/tools/landrun-src checkout "$LANDRUN_REV"
          mkdir -p ~/tools/bin
          cd ~/tools/landrun-src && CGO_ENABLED=0 go build -o ~/tools/bin/landrun ./cmd/landrun

      - name: Build nanoda
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          git clone https://github.com/ammkrn/nanoda_lib ~/tools/nanoda_lib
          git -C ~/tools/nanoda_lib checkout "$NANODA_REV"
          cd ~/tools/nanoda_lib && cargo +stable build --release

      - name: Enable the nanoda kernel check (CI-only, on the workspace copy)
        # The committed configs set enable_nanoda: false so that local
        # reproduction needs only three tools; CI exercises the stronger
        # two-kernel variant on its throwaway checkout.
        run: |
          sed -i 's/"enable_nanoda": false/"enable_nanoda": true/' Audit/*/comparator.json

      - name: Run the comparator on every pair
        run: |
          set -euo pipefail
          # Resolve the tool paths from the runner's real home, never a
          # hard-coded hosted-runner location.
          export COMPARATOR_LANDRUN="$HOME/tools/bin/landrun"
          export COMPARATOR_LEAN4EXPORT="$HOME/tools/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_NANODA="$HOME/tools/nanoda_lib/target/release/nanoda_bin"
          fail=0
          for cfg in Audit/*/comparator.json; do
            X="$(basename "$(dirname "$cfg")")"
            echo "::group::$X"
            if lake env ~/tools/comparator/.lake/build/bin/comparator "$cfg" \
                 | tee "/tmp/comparator-$X.log" \
               && grep -q "Your solution is okay!" "/tmp/comparator-$X.log"; then
              echo "$X: OK"
            else
              echo "$X: FAILED"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Save project and dependency build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/lattice-probability/.lake/build
          key: lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Save verification tools
        if: always() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Upload comparator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-logs
          path: /tmp/comparator-*.log
